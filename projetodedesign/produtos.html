<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Meu Blush | Produtos </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
    <div class="container nav">
        <a class="brand" href="index.html">
            <span class="brand-mark"> ♡ </span>
            <span>Meu<br>Blush</span>
        </a>

        <nav class="nav-links">
            <a href="index.html">Início</a>
            <a class="active" href="produtos.html"> Produtos </a>
            <a href="sobre.html"> Sobre Nós </a>
        </nav>
    </div>
</header>

<main class="container">

    <section class="page-heading">
        <span class="eyebrow"> Nossa coleção </span>
        <h1> Escolha sua cor </h1>
        <p> Três opções delicadas para completar sua make. </p>
    </section>

    <form id="busca" class="filters">
        <input
            type="search"
            name="nome"
            id="nomeBusca"
            placeholder="⌕ Buscar produtos..."
            aria-label="Buscar produtos">

        <button class="btn" type="submit"> Buscar </button>
    </form>

    <div class="category-filters">
        <button class="filter-btn active" type="button" data-type="todos">
            Todos
        </button>

        <button class="filter-btn" type="button" data-type="po">
            Em pó
        </button>

        <button class="filter-btn" type="button" data-type="cremoso">
            Cremoso
        </button>
    </div>

    <section class="product-grid" id="product-list"></section>

    <p class="empty-message" id="empty-message" hidden>
        Nenhum produto encontrado.
    </p>

</main>

<footer class="site-footer">
    <div class="container">
        ♡ Meu Blush — Um toque de cor, do seu jeito.
    </div>
</footer>
<script src="./script.js"></script>

<script>
    const product_list = document.getElementById("product-list");
    const busca = document.getElementById("busca");
    const empty_message = document.getElementById("empty-message");

    let categoriaAtual = "todos";

    function mostrarProdutos() {
        product_list.innerHTML = "";

        const nome = busca.nome.value.toLowerCase().trim();

        let encontrados = lista.filter(function(item) {
            const combinaNome = item.nome.toLowerCase().includes(nome);

            const combinaCategoria =
                categoriaAtual === "todos" ||
                item.categoria === categoriaAtual;

            return combinaNome && combinaCategoria;
        });

        encontrados.forEach(function(item) {
            product_list.append(item.card());
        });

        empty_message.hidden = encontrados.length > 0;
    }

    busca.addEventListener("submit", function(e) {
        e.preventDefault();
        mostrarProdutos();
    });

    busca.nome.addEventListener("input", mostrarProdutos);

    document.querySelectorAll(".filter-btn").forEach(function(botao) {
        botao.addEventListener("click", function() {
            categoriaAtual = botao.dataset.type;

            document.querySelectorAll(".filter-btn").forEach(function(item) {
                item.classList.remove("active");
            });

            botao.classList.add("active");
            mostrarProdutos();
        });
    });

    window.addEventListener("load", mostrarProdutos);
</script>
</body>
</html>
